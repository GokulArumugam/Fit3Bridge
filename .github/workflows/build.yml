# Builds an unsigned Fit3Bridge.ipa on GitHub's macOS runners (no local Xcode needed)
# and publishes it as the "latest" release, so the iPhone can download it directly.
# The IPA is signed on the phone by SideStore (free Apple ID).
name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Protocol checks
        run: cd Fit3Kit && swift run Fit3KitChecks

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fit3Bridge.xcodeproj \
            -scheme Fit3Bridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E 'error:|warning: |BUILD' || true
          test -d build/Build/Products/Release-iphoneos/Fit3Bridge.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fit3Bridge.app Payload/
          zip -qry Fit3Bridge.ipa Payload
          ls -la Fit3Bridge.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fit3Bridge-ipa
          path: Fit3Bridge.ipa

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Fit3Bridge.ipa \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Install with SideStore." \
            --prerelease

      - name: Show build log on failure
        if: failure()
        run: tail -200 build.log || true
